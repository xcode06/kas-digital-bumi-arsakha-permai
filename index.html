<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kas Digital - Perumahan Bumi Arsakha Permai</title>
  
  <!-- Favicon Logo Perumahan Bumi Arsakha Permai -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 200 200' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='100' cy='90' r='65' fill='%23F59E0B' opacity='0.95'/%3E%3Cpath d='M 20,105 Q 100,75 180,105 C 140,115 60,115 20,105 Z' fill='%2315803D'/%3E%3Cpath d='M 15,120 Q 100,88 185,120 C 150,132 50,132 15,120 Z' fill='%23166534'/%3E%3Cpath d='M 30,102 L 70,68 L 110,102 V 132 H 30 Z' fill='%2315803D' stroke='%23FFFFFF' stroke-width='4'/%3E%3Cpath d='M 60,92 L 100,58 L 140,92 V 128 H 60 Z' fill='%23166534' stroke='%23FFFFFF' stroke-width='5'/%3E%3Cpath d='M 115,95 L 145,70 L 175,95 V 125 H 115 Z' fill='%2315803D' stroke='%23FFFFFF' stroke-width='4'/%3E%3Cpath d='M 135,70 Q 155,30 165,10 Q 180,35 160,60 Z' fill='%2322C55E'/%3E%3Cpath d='M 150,55 Q 178,30 190,15 Q 195,40 168,62 Z' fill='%2316A34A'/%3E%3C/svg%3E" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @media print {
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- LOGO & STEMPEL SVG COMPONENTS ---
    const LogoBumiArsakha = ({ className = "h-12", showSubtext = true, isDarkBg = false }) => (
      <div className="inline-flex items-center gap-3 select-none">
        <div className="relative flex items-center justify-center filter drop-shadow-sm">
          <svg className={`${className} aspect-square`} viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="90" r="65" fill="#F59E0B" opacity="0.95" />
            <path d="M 20,105 Q 100,75 180,105 C 140,115 60,115 20,105 Z" fill="#15803D" />
            <path d="M 15,120 Q 100,88 185,120 C 150,132 50,132 15,120 Z" fill="#166534" />
            <path d="M 30,102 L 70,68 L 110,102 V 132 H 30 Z" fill="#15803D" stroke="#FFFFFF" strokeWidth="4" />
            <path d="M 60,92 L 100,58 L 140,92 V 128 H 60 Z" fill="#166534" stroke="#FFFFFF" strokeWidth="5" />
            <path d="M 115,95 L 145,70 L 175,95 V 125 H 115 Z" fill="#15803D" stroke="#FFFFFF" strokeWidth="4" />
            <path d="M 135,70 Q 155,30 165,10 Q 180,35 160,60 Z" fill="#22C55E" />
            <path d="M 150,55 Q 178,30 190,15 Q 195,40 168,62 Z" fill="#16A34A" />
          </svg>
        </div>
        <div className="flex flex-col">
          <span className={`text-[10px] font-black uppercase tracking-[0.2em] leading-none ${isDarkBg ? 'text-amber-300' : 'text-emerald-800'}`}>
            PERUMAHAN
          </span>
          <span className={`text-base md:text-xl font-serif font-black uppercase tracking-tight leading-tight ${isDarkBg ? 'text-white' : 'text-slate-900'}`}>
            BUMI ARSAKHA PERMAI
          </span>
          {showSubtext && (
            <span className={`text-[9px] font-semibold tracking-wider ${isDarkBg ? 'text-emerald-100/80' : 'text-slate-500'}`}>
              Lembursawah, Kec. Cicantayan, Sukabumi
            </span>
          )}
        </div>
      </div>
    );

    const SealStempelOfficial = ({ size = "w-28 h-28", opacity = "opacity-90" }) => (
      <div className={`relative inline-flex items-center justify-center p-1 rounded-full border-2 border-emerald-700 text-emerald-800 bg-emerald-50/20 transform rotate-[-6deg] pointer-events-none select-none ${opacity} ${size}`}>
        <svg className="w-full h-full" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="100" r="95" stroke="#15803d" strokeWidth="6" />
          <circle cx="100" cy="100" r="86" stroke="#15803d" strokeWidth="2.5" />
          <circle cx="100" cy="100" r="62" stroke="#15803d" strokeWidth="3" />
          <path id="textPathTop" d="M 25,100 A 75,75 0 1,1 175,100" fill="none" />
          <text fill="#14532d" fontSize="18" fontWeight="900" letterSpacing="3">
            <textPath href="#textPathTop" startOffset="50%" textAnchor="middle">PERUMAHAN</textPath>
          </text>
          <path id="textPathBottom" d="M 175,100 A 75,75 0 0,1 25,100" fill="none" />
          <text fill="#14532d" fontSize="14" fontWeight="900" letterSpacing="1.5">
            <textPath href="#textPathBottom" startOffset="50%" textAnchor="middle">BUMI ARSAKHA PERMAI</textPath>
          </text>
          <path d="M 32,100 L 35,93 L 42,93 L 36,88 L 38,81 L 32,85 L 26,81 L 28,88 L 22,93 L 29,93 Z" fill="#15803d" />
          <path d="M 168,100 L 171,93 L 178,93 L 172,88 L 174,81 L 168,85 L 162,81 L 164,88 L 158,93 L 165,93 Z" fill="#15803d" />
          <g transform="translate(45, 60) scale(0.55)">
            <path d="M 30,70 A 45,45 0 0,1 170,70 Z" fill="#15803d" />
            <path d="M 20,80 L 50,55 L 80,80 V 110 H 20 Z" fill="#166534" stroke="#ffffff" strokeWidth="3" />
            <path d="M 50,70 L 100,30 L 150,70 V 110 H 50 Z" fill="#15803d" stroke="#ffffff" strokeWidth="4" />
            <path d="M 120,70 L 150,45 L 180,70 V 110 H 120 Z" fill="#166534" stroke="#ffffff" strokeWidth="3" />
            <path d="M 140,45 Q 160,15 165,0 Q 175,20 160,40 Z" fill="#22c55e" />
            <path d="M 155,35 Q 180,15 190,5 Q 195,25 168,42 Z" fill="#16a34a" />
            <path d="M 10,115 Q 100,85 190,110 C 150,125 70,125 10,115 Z" fill="#14532d" />
          </g>
        </svg>
      </div>
    );

    // --- DATA AWAL ---
    const INITIAL_USERS = [
      { id: 'usr-00', username: 'superadmin', password: 'admin123', name: 'SuperAdmin System', role: 'SUPERADMIN' },
      { id: 'usr-01', username: 'cece', password: 'password123', name: 'Bapak Cece', role: 'KETUA' },
      { id: 'usr-02', username: 'rahman', password: 'password123', name: 'Rahman', role: 'SEKRETARIS' },
      { id: 'usr-03', username: 'yana', password: 'password123', name: 'Yana', role: 'BENDAHARA' },
      { id: 'usr-04', username: 'erus', password: 'password123', name: 'Erus', role: 'PETUGAS' },
      { id: 'usr-05', username: 'tina', password: 'password123', name: 'Tina', role: 'ADMIN' },
      { id: 'usr-06', username: 'budi', password: 'password123', name: 'Budi Santoso', role: 'WARGA' }
    ];

    const INITIAL_HOUSES = [
      { id: 'h-1', block: 'Blok A', number: '01', residentName: 'Budi Santoso', phone: '081234567890', isMandatory: true, collector: 'Erus' },
      { id: 'h-2', block: 'Blok A', number: '02', residentName: 'Dewi Lestari', phone: '081987654321', isMandatory: true, collector: 'Erus' },
      { id: 'h-3', block: 'Blok B', number: '05', residentName: 'Ahmad Subagja', phone: '085712345678', isMandatory: true, collector: 'Erus' }
    ];

    const INITIAL_EXPENSE_CATEGORIES = ['Keamanan & Peronda', 'Kebersihan & Sampah', 'Perbaikan Infrastruktur', 'Acara Warga', 'Administrasi & ATK'];
    const MONTH_NAMES = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [activeTab, setActiveTab] = useState('dashboard');

      // LocalStorage Load/Save
      const loadData = (key, fallback) => {
        try {
          const item = localStorage.getItem(`kas_bap_${key}`);
          return item ? JSON.parse(item) : fallback;
        } catch { return fallback; }
      };

      const saveData = (key, data) => {
        try { localStorage.setItem(`kas_bap_${key}`, JSON.stringify(data)); } catch (e) {}
      };

      const [users, setUsers] = useState(() => loadData('users', INITIAL_USERS));
      const [houses, setHouses] = useState(() => loadData('houses', INITIAL_HOUSES));
      const [bills, setBills] = useState(() => loadData('bills', []));
      const [incomes, setIncomes] = useState(() => loadData('incomes', []));
      const [expenseRequests, setExpenseRequests] = useState(() => loadData('expenseRequests', []));
      const [categories, setCategories] = useState(() => loadData('categories', INITIAL_EXPENSE_CATEGORIES));

      useEffect(() => saveData('users', users), [users]);
      useEffect(() => saveData('houses', houses), [houses]);
      useEffect(() => saveData('bills', bills), [bills]);
      useEffect(() => saveData('incomes', incomes), [incomes]);
      useEffect(() => saveData('expenseRequests', expenseRequests), [expenseRequests]);
      useEffect(() => saveData('categories', categories), [categories]);

      // Calculations
      const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val || 0);
      const totalIncome = useMemo(() => incomes.reduce((a, b) => a + b.amount, 0), [incomes]);
      const totalExpense = useMemo(() => expenseRequests.filter(e => e.status === 'REALIZED').reduce((a, b) => a + b.amount, 0), [expenseRequests]);
      const currentBalance = useMemo(() => totalIncome - totalExpense, [totalIncome, totalExpense]);

      const handleLogin = (e) => {
        e.preventDefault();
        const found = users.find(u => u.username.toLowerCase() === loginUsername.trim().toLowerCase() && u.password === loginPassword);
        if (found) { setCurrentUser(found); setLoginError(''); }
        else { setLoginError('Username atau Password tidak cocok!'); }
      };

      const handleResetTransactions = () => {
        if (window.confirm('Apakah Anda yakin ingin me-reset seluruh aktivitas transaksi menjadi 0? Data warga tidak akan terhapus.')) {
          setIncomes([]);
          setBills([]);
          setExpenseRequests([]);
        }
      };

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl shadow-xl border border-slate-200 max-w-md w-full p-8 space-y-6">
              <div className="text-center space-y-3">
                <LogoBumiArsakha className="h-16 mx-auto" showSubtext={true} />
                <h1 className="text-xl font-bold text-slate-900 pt-2">Sistem Laporan Kas Digital</h1>
                <p className="text-xs text-slate-500">Masuk dengan akun terdaftar untuk mengakses aplikasi</p>
              </div>
              {loginError && <div className="bg-rose-50 text-rose-700 text-xs p-3 rounded-xl border border-rose-200">{loginError}</div>}
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold mb-1">Username</label>
                  <input type="text" required value={loginUsername} onChange={e=>setLoginUsername(e.target.value)} className="w-full text-sm px-4 py-2.5 rounded-xl border" placeholder="superadmin / cece / yana" />
                </div>
                <div>
                  <label className="block text-xs font-semibold mb-1">Password</label>
                  <input type="password" required value={loginPassword} onChange={e=>setLoginPassword(e.target.value)} className="w-full text-sm px-4 py-2.5 rounded-xl border" placeholder="••••••••" />
                </div>
                <button type="submit" className="w-full bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-emerald-800 text-sm">Masuk ke Aplikasi</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          <header className="bg-emerald-900 text-white p-4 shadow-md flex justify-between items-center no-print">
            <LogoBumiArsakha className="h-10" showSubtext={false} isDarkBg={true} />
            <div className="flex items-center gap-4">
              <span className="text-xs font-bold">{currentUser.name} ({currentUser.role})</span>
              <button onClick={() => setCurrentUser(null)} className="bg-emerald-800 hover:bg-emerald-700 px-3 py-1.5 rounded-xl text-xs font-bold">Keluar</button>
            </div>
          </header>

          <div className="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="bg-emerald-900 text-white p-6 rounded-3xl shadow-sm">
                <span className="text-xs font-semibold text-emerald-200">Saldo Kas Akhir</span>
                <div className="text-2xl font-black font-mono mt-2">{formatIDR(currentBalance)}</div>
              </div>
              <div className="bg-white p-6 rounded-3xl border shadow-sm">
                <span className="text-xs font-semibold text-slate-500">Total Pemasukan</span>
                <div className="text-xl font-bold font-mono text-emerald-700 mt-2">{formatIDR(totalIncome)}</div>
              </div>
              <div className="bg-white p-6 rounded-3xl border shadow-sm">
                <span className="text-xs font-semibold text-slate-500">Total Pengeluaran</span>
                <div className="text-xl font-bold font-mono text-rose-700 mt-2">{formatIDR(totalExpense)}</div>
              </div>
            </div>

            <div className="bg-white border p-6 rounded-3xl shadow-sm space-y-4">
              <div className="flex justify-between items-center border-b pb-4">
                <h3 className="font-bold text-slate-900 text-sm">Aktivitas Transaksi Kas</h3>
                <div className="flex gap-2">
                  {['SUPERADMIN', 'BENDAHARA'].includes(currentUser.role) && (
                    <button onClick={handleResetTransactions} className="bg-rose-50 text-rose-700 border border-rose-200 px-3 py-1.5 rounded-xl text-xs font-bold">Reset Transaksi (0)</button>
                  )}
                  <button onClick={() => window.print()} className="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold no-print">Cetak Laporan PDF</button>
                </div>
              </div>
              <p className="text-xs text-slate-600">Aplikasi Kas Digital Perumahan Bumi Arsakha Permai siap digunakan dan data otomatis tersimpan secara aman di memori browser Anda.</p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
